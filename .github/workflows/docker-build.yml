name: Build and push Docker images
jobs:
  build-and-push:
    if: needs.check-changes.outputs.should_build == 'true'
    needs: check-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          no-cache: true # Disables cache to ensure fresh git clone and base packages
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8,linux/ppc64le,linux/riscv64,linux/s390x
          provenance: mode=max
          push: true
          sbom: true
          tags: |
            ctassisf/ripe-atlas-alpine:${{ needs.check-changes.outputs.probe_version }}
            ctassisf/ripe-atlas-alpine:latest
            ghcr.io/ctassisf/ripe-atlas-alpine:${{ needs.check-changes.outputs.probe_version }}
            ghcr.io/ctassisf/ripe-atlas-alpine:latest
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      probe_version: ${{ steps.fetch-state.outputs.probe_version }}
      should_build: ${{ steps.evaluate.outputs.should_build }}
    steps:
      - id: fetch-state
        name: Fetch Upstream State
        run: |
          # 1. Fetch current RIPE Atlas Software Probe version
          VERSION=$(curl -fsSL https://raw.githubusercontent.com/RIPE-NCC/ripe-atlas-software-probe/master/VERSION)
          echo "probe_version=$VERSION" >> "$GITHUB_OUTPUT"
          # 2. Fetch Alpine Linux latest digest from Docker Hub API
          TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/alpine:pull" | jq -r .token)
          ALPINE_DIGEST=$(curl -s -I -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.docker.distribution.manifest.v2+json" "https://index.docker.io/v2/library/alpine/manifests/latest" | grep -i 'docker-content-digest' | tr -d '\r' | awk '{print $2}')
          # 3. Combine into a unique state hash
          echo "STATE_HASH=${VERSION}-${ALPINE_DIGEST}" >> "$GITHUB_ENV"
      - id: cache-check
        name: Check if state was built previously
        uses: actions/cache@v6
        with:
          key: build-state-${{ env.STATE_HASH }}
          path: .built_state
      - id: evaluate
        name: Evaluate Build Necessity
        run: |
          # Always build on manual trigger or push events
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "${{ env.STATE_HASH }}" > .built_state
          # Build if the cache key (State Hash) was not found
          elif [ "${{ steps.cache-check.outputs.cache-hit }}" != 'true' ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New upstream state detected. Creating cache marker..."
            echo "${{ env.STATE_HASH }}" > .built_state
          # Skip if neither dependency changed
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No changes in RIPE Atlas Software Probe or Alpine Linux detected. Skipping build."
          fi
on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '19 6 * * *' # Executes daily at 06:19 UTC
  workflow_dispatch:
